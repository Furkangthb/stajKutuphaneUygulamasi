name: stajKutuphaneUygulamasi
services:
  nginx:
    image: nginx:latest
    container_name: stajKutuphaneNginx
    ports:
      - "${WEB_PORTU:-54080}:80"
      - "${WEB_PORTU_SSL:-54443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - golang
    networks:
      stajKutuphaneNetwork:
        ipv4_address: 172.20.0.2
    

  postgres:
    image: postgres:16-alpine
    container_name: stajKutuphanePostgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data-yeni:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      stajKutuphaneNetwork:
        ipv4_address: 172.20.0.3



  golang:
    image: golang:latest
    container_name: stajKutuphaneGolang
    working_dir: /app
    volumes:
      - ./:/app
      - go-bin:/go/bin
      - go-pkg:/go/pkg
    command: sh -c "go install github.com/air-verse/air@latest && air --build.cmd 'go build -buildvcs=false -o ./tmp/main ./cmd/api'"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-stajKutuphanePostgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-stajKutuphanePostgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=disable
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      stajKutuphaneNetwork:
        ipv4_address: 172.20.0.4


  redis:
    image: redis:latest
    container_name: stajKutuphaneRedis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      stajKutuphaneNetwork:
          ipv4_address: 172.20.0.5
  frontend:
      image: node:20-alpine
      container_name: stajKutuphaneFrontend
      working_dir: /app
      volumes:
        - ./frontend:/app
        - /app/node_modules 
     
      command: sh -c "npm install && npm run dev" 
      ports:
        - "5173:5173" 
      depends_on:
        - golang
      networks:
        stajKutuphaneNetwork:
          ipv4_address: 172.20.0.6
volumes:
  redis-data:
    driver: local
  postgres-data-yeni:
    driver: local
  go-bin:
    driver: local
  go-pkg:
    driver: local

networks:
  stajKutuphaneNetwork:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1